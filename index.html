<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kim Binasoy · Van Camp</title>
    <meta name="description" content="Kim Edrian Binasoy — Cloud, DevOps, QA Automation &amp; AI engineer. A cosy 3D camping scene inside the minivan Kim and Wingwing built, parked at a golden-hour lake. Open the laptop for his work." />
    <meta name="theme-color" content="#1E1F22" />
    <link rel="canonical" href="https://binasoy.kim/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      #boot-loader { display: none; }
      html.boot-3d #boot-loader, .loader { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 105%, #F6C27A 0%, #E9935A 30%, #B86A7A 58%, #4C3B5C 82%, #241F2E 100%);
        color: #FBF6EE; font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; }
      html.mode-reader #boot-loader { display: none; }
      #boot-loader.is-handoff { opacity: 0; transition: opacity .22s; pointer-events: none; }
      .loader__card { display: grid; justify-items: center; gap: 12px; padding: 24px; text-align: center; width: min(360px, 90vw); }
      .vanart-wrap { background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .2s cubic-bezier(.2,.8,.2,1); }
      .vanart-wrap:hover { transform: scale(1.03); }
      .vanart-wrap.is-honk { transform: translateY(-6px) rotate(-2deg) scale(1.05); }
      .vanart { width: min(280px, 74vw); height: auto; overflow: visible; filter: drop-shadow(0 10px 20px #0004); }
      .vanart__string { stroke: #2A2420; stroke-width: 1.4; opacity: .7; }
      .vanart__bulbs circle { fill: #FFD58A; filter: drop-shadow(0 0 4px #FFD58A); animation: bulb 1.4s ease-in-out infinite; }
      .vanart__bulbs circle:nth-child(3n+1) { animation-delay: -.45s; } .vanart__bulbs circle:nth-child(3n+2) { animation-delay: -.95s; }
      .vanart__body { fill: #F2F2EE; } .vanart__glass { fill: #3B3340; } .vanart__trim { fill: #CFCBC4; }
      .vanart__tyre { fill: #1E1F22; } .vanart__hub { fill: #9A958E; }
      .vanart__spokes line { stroke: #1E1F22; stroke-width: 1.6; stroke-linecap: round; }
      .vanart__spokes { animation: wheel-spin .55s linear infinite; }
      .vanart__chassis { animation: van-bounce .65s ease-in-out infinite alternate; transform-origin: center; }
      .vanart__road line { stroke: #FFE49E88; stroke-width: 2.2; stroke-linecap: round; animation: road-scroll .55s linear infinite; }
      .vanart__trees { animation: trees-scroll 2.6s linear infinite; }
      @keyframes bulb { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      @keyframes wheel-spin { to { transform: rotate(360deg); } }
      @keyframes van-bounce { from { transform: translateY(0); } to { transform: translateY(-2.2px); } }
      @keyframes road-scroll { from { transform: translateX(0); } to { transform: translateX(-56px); } }
      @keyframes trees-scroll { from { transform: translateX(0); } to { transform: translateX(-114px); } }
      .loader__head { display: flex; align-items: baseline; justify-content: space-between; width: 100%; gap: 10px; margin-top: 2px; }
      .loader__title { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: .01em; text-shadow: 0 2px 12px #0005; }
      .loader__pct { font-family: ui-monospace, "JetBrains Mono", Consolas, monospace; font-size: 15px; font-weight: 800; color: #FFD58A; }
      .loader__bar { width: 100%; height: 8px; border-radius: 99px; background: #00000045; overflow: hidden; box-shadow: inset 0 1px 3px #0006; position: relative; }
      .loader__bar span { display: block; height: 100%; border-radius: inherit; transform-origin: left; transform: scaleX(.06); transition: transform .18s ease-out;
        background: repeating-linear-gradient(-45deg, #FFD58A 0 10px, #FFF1D0 10px 20px); background-size: 28px 28px; animation: bar-shimmer .7s linear infinite; }
      #boot-loader .loader__bar span { animation: boot-bar 3.2s cubic-bezier(.12,.65,.25,.95) forwards, bar-shimmer .7s linear infinite; }
      @keyframes boot-bar { 0% { transform: scaleX(.06); } 100% { transform: scaleX(.48); } }
      @keyframes bar-shimmer { to { background-position: 28px 0; } }
      .loader__steps { list-style: none; margin: 2px 0 0; padding: 10px 14px; width: 100%; border-radius: 14px; background: #1e1f2259; backdrop-filter: blur(6px); display: grid; gap: 5px; text-align: left; font-size: 12.5px; }
      .loader__steps li { display: flex; align-items: center; gap: 8px; opacity: .55; transition: opacity .2s, color .2s; }
      .loader__steps li.is-curr { opacity: 1; color: #FFF1D0; font-weight: 700; }
      .loader__steps li.is-done { opacity: .92; color: #FFD58A; }
      .loader__step-ic { font-style: normal; width: 14px; text-align: center; font-weight: 900; }
      .loader__steps li.is-curr .loader__step-ic { animation: pulse-ic .9s ease-in-out infinite alternate; }
      @keyframes pulse-ic { from { transform: scale(.85); opacity: .6; } to { transform: scale(1.15); opacity: 1; } }
      .loader__line { margin: 0; min-height: 1.3em; font-size: 12.5px; opacity: .85; }
      @media (prefers-reduced-motion: reduce) {
        .vanart__bulbs circle, .vanart__spokes, .vanart__chassis, .vanart__road line, .vanart__trees, .loader__bar span, #boot-loader .loader__bar span { animation: none; }
      }
      @media print { #boot-loader { display: none !important; } }
    </style>
    <script>
      (function () {
        var d = document.documentElement; d.classList.add('js');
        try {
          var q = new URLSearchParams(location.search);
          if (q.has('reader') || localStorage.getItem('kb:mode') === 'reader') return;
          if (matchMedia('(prefers-reduced-motion: reduce)').matches && !q.has('3d')) return;
          var c = document.createElement('canvas');
          if (!(c.getContext('webgl2') || c.getContext('webgl'))) return;
          d.classList.add('boot-3d');
          setTimeout(function () { if (!d.classList.contains('mode-3d')) d.classList.remove('boot-3d'); }, 25000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main id="reader"><!--READER--></main>
    <div id="app" aria-hidden="true"></div>
    <div id="boot-loader" aria-hidden="true">
      <div class="loader__card">
        <div class="vanart-wrap"><svg class="vanart" viewBox="0 0 280 132" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="beamGrad" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#FFE49E" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFE49E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sceneClip"><rect x="10" y="6" width="260" height="118" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#sceneClip)">
    <!-- Scrolling background autumn trees -->
    <g class="vanart__trees">
      <polygon points="36,104 46,72 56,104" fill="#2F4A3A" opacity="0.55"/>
      <circle cx="92" cy="86" r="14" fill="#D9682B" opacity="0.5"/>
      <rect x="90" y="94" width="3" height="10" fill="#3B2D26" opacity="0.5"/>
      <polygon points="150,104 162,66 174,104" fill="#2F4A3A" opacity="0.5"/>
      <circle cx="222" cy="84" r="15" fill="#E3A63B" opacity="0.5"/>
      <rect x="220" y="94" width="3" height="10" fill="#3B2D26" opacity="0.5"/>
      <polygon points="276,104 286,72 296,104" fill="#2F4A3A" opacity="0.55"/>
      <circle cx="332" cy="86" r="14" fill="#D9682B" opacity="0.5"/>
    </g>
    <!-- Overhead twinkling fairy lights -->
    <path class="vanart__string" d="M18 22 Q82 42 140 24 T262 22" fill="none"/>
    <g class="vanart__bulbs">
      <circle cx="34" cy="28" r="3"/><circle cx="60" cy="34" r="3"/><circle cx="88" cy="34" r="3"/>
      <circle cx="116" cy="29" r="3"/><circle cx="144" cy="23" r="3"/><circle cx="172" cy="20" r="3"/>
      <circle cx="200" cy="22" r="3"/><circle cx="228" cy="25" r="3"/><circle cx="252" cy="23" r="3"/>
    </g>
    <!-- Scrolling road dashes -->
    <line x1="12" y1="106" x2="268" y2="106" stroke="#ffffff26" stroke-width="2" stroke-linecap="round"/>
    <g class="vanart__road">
      <line x1="20" y1="112" x2="48" y2="112"/><line x1="76" y1="112" x2="104" y2="112"/>
      <line x1="132" y1="112" x2="160" y2="112"/><line x1="188" y1="112" x2="216" y2="112"/>
      <line x1="244" y1="112" x2="272" y2="112"/><line x1="300" y1="112" x2="328" y2="112"/>
    </g>
    <!-- Ground shadow -->
    <ellipse cx="136" cy="105" rx="90" ry="4.5" fill="#00000040"/>
    <!-- Bouncing van body + headlight beam -->
    <g class="vanart__chassis">
      <polygon class="vanart__beam" points="228,74 278,60 278,96 228,84" fill="url(#beamGrad)"/>
      <path class="vanart__body" d="M46 95 V69 Q46 57 58 53 L88 45 Q96 43 104 43 H202 Q218 43 222 57 L228 76 V95 Z"/>
      <path class="vanart__glass" d="M90 51 Q94 49 102 49 H126 V67 H78 Z M132 49 H164 V67 H132 Z M170 49 H200 Q210 49 213 59 L215 67 H170 Z"/>
      <rect class="vanart__trim" x="46" y="83" width="182" height="4.5" rx="2"/>
      <!-- Tail light & warm headlight -->
      <rect x="46" y="64" width="4.5" height="12" rx="2" fill="#D94B38"/>
      <rect x="223" y="72" width="5.5" height="8" rx="2.5" fill="#FFF3B8"/>
      <!-- Roof rack -->
      <rect x="86" y="40" width="96" height="2.5" rx="1.2" fill="#CFCBC4"/>
    </g>
    <!-- Spinning rear wheel -->
    <g transform="translate(82 95)">
      <circle class="vanart__tyre" r="12"/><circle class="vanart__hub" r="5.5"/>
      <g class="vanart__spokes"><line x1="-5" y1="0" x2="5" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/></g>
    </g>
    <!-- Spinning front wheel -->
    <g transform="translate(196 95)">
      <circle class="vanart__tyre" r="12"/><circle class="vanart__hub" r="5.5"/>
      <g class="vanart__spokes"><line x1="-5" y1="0" x2="5" y2="0"/><line x1="0" y1="-5" x2="0" y2="5"/></g>
    </g>
  </g>
</svg></div>
        <div class="loader__head">
          <p class="loader__title">Driving to the campsite…</p>
          <span class="loader__pct">…</span>
        </div>
        <div class="loader__bar"><span></span></div>
        <ul class="loader__steps">
          <li class="is-curr"><i class="loader__step-ic">◉</i><span>Algonquin lake &amp; 8,000 autumn trees</span></li>
          <li><i class="loader__step-ic">○</i><span>Pacifica camper bed &amp; fairy lights</span></li>
          <li><i class="loader__step-ic">○</i><span>Inflating Kim &amp; Wingwing’s raft</span></li>
          <li><i class="loader__step-ic">○</i><span>Booting KimOS &amp; lake reflections</span></li>
        </ul>
        <p class="loader__line">Tip: tap the minivan to honk while we park by the lake</p>
      </div>
    </div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
