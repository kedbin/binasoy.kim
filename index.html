<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kim Binasoy · Van Camp</title>
    <meta name="description" content="Kim Edrian Binasoy — Cloud, DevOps, QA Automation &amp; AI engineer. A cosy 3D camping scene inside the minivan Kim and Wingwing built, parked at a golden-hour lake. Open the laptop for his work." />
    <meta name="theme-color" content="#1E1F22" />
    <link rel="canonical" href="https://binasoy.kim/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* Loader (both stages). Static stage shows only in 3D mode: html.boot-3d is set by the gate below. */
      #boot-loader { display: none; }
      html.boot-3d #boot-loader, .loader { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
        background: radial-gradient(120% 90% at 50% 105%, #F6C27A 0%, #E9935A 30%, #B86A7A 58%, #4C3B5C 82%, #241F2E 100%);
        color: #FBF6EE; font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; }
      html.mode-reader #boot-loader { display: none; }
      #boot-loader.is-handoff { opacity: 0; transition: opacity .3s .1s; }
      .loader__card { display: grid; justify-items: center; gap: 14px; padding: 24px; text-align: center; }
      .vanart { width: min(280px, 68vw); height: auto; overflow: visible; filter: drop-shadow(0 10px 20px #0004); }
      .vanart__string { stroke: #2A2420; stroke-width: 1.4; opacity: .7; }
      .vanart__bulbs circle { fill: #FFD58A; filter: drop-shadow(0 0 4px #FFD58A); animation: bulb 1.6s ease-in-out infinite; }
      .vanart__bulbs circle:nth-child(3n+1) { animation-delay: -.5s; } .vanart__bulbs circle:nth-child(3n+2) { animation-delay: -1.1s; }
      .vanart__body { fill: #F2F2EE; } .vanart__glass { fill: #3B3340; } .vanart__trim { fill: #CFCBC4; }
      .vanart__tyre { fill: #1E1F22; } .vanart__hub { fill: #9A958E; }
      @keyframes bulb { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
      .loader__title { margin: 6px 0 0; font-size: 20px; font-weight: 700; letter-spacing: .01em; text-shadow: 0 2px 12px #0005; }
      .loader__bar { width: min(260px, 64vw); height: 6px; border-radius: 99px; background: #0003; overflow: hidden; box-shadow: inset 0 1px 2px #0003; }
      .loader__bar span { display: block; height: 100%; background: linear-gradient(90deg, #FFD58A, #FFF1D0); border-radius: inherit; transform-origin: left; transform: scaleX(.04); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
      #boot-loader .loader__bar span { animation: boot-bar 8s cubic-bezier(.1,.6,.3,1) forwards; }
      @keyframes boot-bar { to { transform: scaleX(.3); } }
      .loader__line { margin: 0; min-height: 1.3em; font-size: 14px; opacity: .9; animation: line-in .5s ease-out; }
      @keyframes line-in { from { opacity: 0; transform: translateY(4px); } }
      @media (prefers-reduced-motion: reduce) { .vanart__bulbs circle, .loader__line, #boot-loader .loader__bar span { animation: none; } }
      @media print { #boot-loader { display: none !important; } }
    </style>
    <script>
      // Progressive enhancement gate. 3D only when JS + WebGL + motion OK. Final tier decision in src/boot.ts.
      // Mirrors boot.ts so the static loader only shows when the 3D chunk is actually going to download.
      (function () {
        var d = document.documentElement; d.classList.add('js');
        try {
          var q = new URLSearchParams(location.search);
          if (q.has('reader') || localStorage.getItem('kb:mode') === 'reader') return;
          if (matchMedia('(prefers-reduced-motion: reduce)').matches && !q.has('3d')) return;
          var c = document.createElement('canvas');
          if (!(c.getContext('webgl2') || c.getContext('webgl'))) return;
          d.classList.add('boot-3d');
          // never let the loader hide the reader if the 3D bundle fails to arrive
          setTimeout(function () { if (!d.classList.contains('mode-3d')) d.classList.remove('boot-3d'); }, 25000);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main id="reader"><!--READER--></main>
    <div id="app" aria-hidden="true"></div>
    <div id="boot-loader" aria-hidden="true"><div class="loader__card"><svg class="vanart" viewBox="0 0 240 120" aria-hidden="true" focusable="false"><path class="vanart__string" d="M14 22 Q62 44 120 26 T226 24" fill="none"/><g class="vanart__bulbs"><circle cx="30" cy="30" r="3"/><circle cx="52" cy="36" r="3"/><circle cx="76" cy="37" r="3"/><circle cx="100" cy="32" r="3"/><circle cx="124" cy="25" r="3"/><circle cx="148" cy="21" r="3"/><circle cx="172" cy="23" r="3"/><circle cx="196" cy="27" r="3"/><circle cx="216" cy="25" r="3"/></g><ellipse cx="120" cy="106" rx="96" ry="5" fill="#0003"/><path class="vanart__body" d="M28 96 V70 Q28 58 40 54 L70 46 Q78 44 86 44 H190 Q206 44 210 58 L214 78 V96 Z"/><path class="vanart__glass" d="M74 52 Q78 50 86 50 H112 V68 H62 Z M118 50 H150 V68 H118 Z M156 50 H188 Q198 50 201 60 L203 68 H156 Z"/><rect class="vanart__trim" x="28" y="84" width="186" height="5" rx="2"/><circle class="vanart__tyre" cx="64" cy="96" r="12"/><circle class="vanart__hub" cx="64" cy="96" r="5"/><circle class="vanart__tyre" cx="182" cy="96" r="12"/><circle class="vanart__hub" cx="182" cy="96" r="5"/><rect x="209" y="62" width="5" height="10" rx="2" fill="#D9682B"/></svg><p class="loader__title">Setting up camp…</p><div class="loader__bar"><span></span></div><p class="loader__line">Packing the van…</p></div></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
